name: Build ArmorPaint for Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout ArmorPaint source
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          submodules: recursive
          lfs: true
          path: armorpaint

      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@v2

      - name: Setup LLVM / clang-cl
        run: |
          choco install llvm -y
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Fetch LFS files in armorcore
        shell: pwsh
        run: |
          cd armorpaint/armorcore
          git lfs install --force
          git lfs pull
          Get-ChildItem -Recurse v8/libraries/win32/release | Select-Object Name, Length

      - name: Unpack V8 monolith (required for build)
        shell: pwsh
        run: |
          $f = "armorpaint/armorcore/v8/libraries/win32/release/v8_monolith.7z"
          if (-not (Test-Path $f)) {
            Write-Error "Missing $f even after LFS pull"
            exit 1
          }
          7z x -y $f -o"armorpaint/armorcore/v8/libraries/win32/release/"

      - name: Generate Visual Studio project
        run: |
          cd armorpaint
          armorcore/Kinc/make --from armorcore -g direct3d11
        shell: cmd

      - name: Compile Release x64
        run: |
          cd armorpaint
          msbuild build/ArmorPaint.sln /p:Configuration=Release /p:Platform=x64 /m
        shell: cmd

      - name: Package portable build
        shell: pwsh
        run: |
          cd armorpaint
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item build/x64/Release/ArmorPaint.exe out/ -Force
          Copy-Item build/krom/data out/data -Recurse -Force
          Compress-Archive -Path out/* -DestinationPath ArmorPaint-Windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: armorpaint/ArmorPaint-Windows-x64.zip
          retention-days: 7
