name: ArmorPaint2026

on: [workflow_dispatch]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # Download source archive using PowerShell native commands
      - name: Download and extract source
        run: |
          Invoke-WebRequest -Uri "https://github.com/armory3d/armorpaint/archive/refs/tags/v1.0.zip" -OutFile "armorpaint.zip"
          Expand-Archive -Path armorpaint.zip -DestinationPath .
          Rename-Item armorpaint-1.0 armorpaint

      # Create V8 directory
      - run: |
          New-Item -ItemType Directory -Force -Path armorpaint\armorcore\v8\libraries\win32\release

      # Download V8 from raw GitHub URL
      - run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/armory3d/armorpaint/v1.0/armorcore/v8/libraries/win32/release/v8_monolith.7z" -OutFile "v8.7z"
          & 'C:\Program Files\7-Zip\7z.exe' x v8.7z -oarmorpaint\armorcore\v8\libraries\win32\release\

      # Generate Visual Studio project
      - run: |
          cd armorpaint\armorcore
          Kinc\make --from armorcore -g direct3d11
          cd ..

      # Build solution
      - run: |
          msbuild build\ArmorPaint.sln /p:Configuration=Release /p:Platform=x64

      # Upload artifact
      - uses: actions/upload-artifact@v4
        with:
          name: armorpaint-windows
          path: build\x64\Release\ArmorPaint.exe
